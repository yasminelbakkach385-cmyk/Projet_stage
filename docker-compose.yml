services:

  # Base de données MySQL
  database:
    image: mysql:8.0
    container_name: baladiya_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: baladiya_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Backend Laravel
  backend:
    build: ./backend
    container_name: baladiya_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database

  # Frontend Angular
  frontend:
    build: ./frontend
    container_name: baladiya_frontend
    restart: always
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Service IA Python
  ai-service:
    build: ./ai-service
    container_name: baladiya_ai
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service:/app

volumes:
  db_data: